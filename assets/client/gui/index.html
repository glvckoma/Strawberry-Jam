<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Strawberry Jam Classic</title>
  </head>

  <body>
    <style>
      html, body {
        height: 100%;
      }

      body {
        background-color: #121212;
        opacity: 0;
        margin: 0;
        overflow: hidden;
        user-select: none;
        cursor: default;
        transition: opacity 0.3s ease-out;
      }

      body.show {
        opacity: 1;
      }

      /* Show login screen immediately when DOM is ready */
      body.dom-ready {
        opacity: 1;
      }

      .no-transition-delays {
        transition: transform 0s !important;
      }

      #game-screen {
        transition: transform 1s;
        width: 100%;
        height: 100%;
        /*TODO: find out why absolute appears to be working like relative*/
        position: absolute;
      }

      #game-screen.show {
        transform: translateY(calc(calc(100vh - 2px) * -1));
      }

      #modal-layer {
        display: flex;
        position: absolute;
        z-index: 1;
        background-color: rgba(0, 0, 0, 0.65);
      }

      /* Load system fonts first as fallback */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }

      /* Lazy load custom fonts after initial render */
      @font-face {
        font-family: 'Tiki-Island';
        src: url("fonts/tiki-island/Tiki-Island.woff");
        font-weight: normal;
        font-style: normal;
        font-display: swap; /* Show fallback font until custom font loads */
      }

      @font-face {
        font-family: 'CCDigitalDelivery';
        src: url("fonts/digital-delivery/CCDigitalDeliveryRegular.woff");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'CCDigitalDelivery-Bold';
        src: url("fonts/digital-delivery/CCDigitalDeliveryBold.woff");
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'CCDigitalDelivery-BoldItalic';
        src: url("fonts/digital-delivery/CCDigitalDeliveryBoldItalic.woff");
        font-weight: bold;
        font-style: italic;
        font-display: swap;
      }

      @font-face {
        font-family: 'CCDigitalDelivery-Italic';
        src: url("fonts/digital-delivery/CCDigitalDeliveryItalic.woff");
        font-weight: normal;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <script>
      "use strict";
      if (!window.ipc) {
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const pathModule = require('path');
        const osModule = require('os');

        const sendWhitelist = new Set([
          "about", "clearAuthToken", "clearRefreshToken", "keyEvent", "loaded",
          "loginSucceeded", "openExternal", "ready", "rememberMeStateUpdated",
          "systemCommand", "translate", "get-setting", "set-setting", "get-api-port",
          "get-server-port", "terminate-port", "get-app-state", "set-app-state",
          "get-df", "toggle-uuid-spoofing", "winReady", "refresh-df",
          "get-saved-accounts", "save-account", "delete-account", "toggle-pin-account",
          "open-user-cache-file", "import-accounts", "delete-all-accounts",
          "request-main-log-path", "exit-confirmation-response", "open-devtools-both",
          "game-webview-console-error", "session-cleanup"
        ]);

        const receiveWhitelist = new Set([
          "set-main-log-path", "response-main-log-path", "autoUpdateStatus", "log",
          "loginInfoLoaded", "postSystemData", "obtainedToken", "screenChange",
          "signupCompleted", "toggleDevTools", "translate",
          "request-toggle-game-client-devtools", "show-exit-confirmation",
          "game-webview-console-error", "port-error", "direct-game-load"
        ]);

        let mainLogPathReceived = null;
        ipcRenderer.on('set-main-log-path', (event, receivedPath) => {
          mainLogPathReceived = receivedPath;
        });

        window.ipc = {
          send: (channel, ...args) => {
            if (sendWhitelist.has(channel)) ipcRenderer.send(channel, ...args);
          },
          on: (channel, listener) => {
            if (receiveWhitelist.has(channel)) ipcRenderer.on(channel, listener);
          },
          once: (channel, listener) => {
            if (receiveWhitelist.has(channel)) ipcRenderer.once(channel, listener);
          },
          off: (channel, listener) => {
            if (receiveWhitelist.has(channel)) ipcRenderer.removeListener(channel, listener);
          },
          invoke: (channel, ...args) => {
            if (sendWhitelist.has(channel)) return ipcRenderer.invoke(channel, ...args);
            return Promise.reject(new Error(`Invoke to channel '${channel}' is not allowed.`));
          },
          setUserAgent: (userAgent) => ipcRenderer.invoke('set-user-agent', userAgent),
          getSetting: (key) => ipcRenderer.invoke('get-setting', key),
          setSetting: (key, value) => ipcRenderer.invoke('set-setting', key, value),
          getDf: () => ipcRenderer.invoke('get-df'),
          refreshDf: () => ipcRenderer.invoke('refresh-df'),
          uuidv4: () => crypto.randomUUID(),
          electronFs: {
            writeFileSync: (filePath, data, encoding) => fs.writeFileSync(filePath, data, encoding),
            readdirSync: (dirPath) => fs.readdirSync(dirPath),
            unlinkSync: (filePath) => fs.unlinkSync(filePath)
          },
          electronPath: {
            join: (...paths) => pathModule.join(...paths)
          },
          getMainLogPath: () => mainLogPathReceived,
          electronOs: {
            homedir: () => osModule.homedir()
          }
        };
      }
    </script>
    <script>
      "use strict";

      const globals = {
        config: (() => { try { return require('./config.js') } catch (_) { return {} } })(),
        systemData: {
          version: "0.0.0", // electron client version
          platform: "unknown", // os
          platformRelease: "0.0.0", // os release version
        },
        authToken: "",
        currentUser: "",
        flashVarsOverride: null,
        language: "en",  // changed later based on preference
        df: "",
        rcToken: "",
        userAbortController: null,

        translate(phrase) {
          return new Promise(resolve => {
            const value = cachedTranslations.get(phrase);
            if (value) {
              resolve(value);
            }
            else {
              const requestId = nextTranslationRequestId;
              nextTranslationRequestId++;
              pendingTranslations.set(requestId, resolve);
              window.ipc.send("translate", {requestId, phrase});
            }
          });
        },

        setLanguage(language) {
          if (language && language != globals.language) {
            globals.language = language;
            cachedTranslations.clear();
            globals.localize();
          }
        },

        fetch(url, options, validCodes) {
          return new Promise(async (resolve, reject) => {
            if (!options.error) options.error = new Error();
            if (!options.startTime) options.startTime = new Date().getTime();
            options.attempts = options.attempts ? options.attempts + 1 : 1;
            if (!options.maxAttempts) options.maxAttempts = 5;
            if (!options.timeout) options.timeout = 10000;
            const requestAbortController = new AbortController();
            options.signal = requestAbortController.signal;
            setTimeout(() => requestAbortController.abort(), options.timeout);
            if (options.userAbortController !== false && globals.userAbortController) {
              options.userAbortController = globals.userAbortController;
              options.userAbortController.signal.addEventListener("abort", () => requestAbortController.abort());
            }
            try {
              const response = await window.fetch(url, options);
              const duration = new Date().getTime() - options.startTime;
              const method = options.method || 'GET';
              console.log(`[SERVER] ${method} ${url} → ${response.status} (${duration}ms)`);
              if ([200].concat(validCodes).includes(response.status)) {
                resolve(response);
              }
              else {
                console.error(`[SERVER] Invalid response code ${response.status} for URL: ${url}`);
                options.error.message = `Invalid response code: ${response.status} for URL: ${url}`;
                reject(options.error);
              }
            }
            catch (err) {
              console.error(`[SERVER] Fetch error for ${url}:`, {
                error: err.name,
                message: err.message,
                attempt: options.attempts
              });
              if (err instanceof DOMException) {
                setTimeout(async () => {
                  if (options.userAbortController && options.userAbortController.signal.aborted) {
                    console.warn(`[SERVER] Fetch aborted by user after ${new Date().getTime() - options.startTime}ms for URL: ${url}`);
                    options.error.name = "Aborted";
                    options.error.message = `Fetch aborted by user after ${new Date().getTime() - options.startTime}ms for URL: ${url}`;
                    reject(options.error);
                  }
                  else if (options.attempts >= options.maxAttempts) {
                    console.error(`[SERVER] Fetch timed out after ${options.attempts} attempts for URL: ${url}`);
                    options.error.name = "TimedOut"
                    options.error.message = `Fetch timed out (attempts:${options.attempts} timeout:${options.timeout}ms) for URL: ${url}`;
                    reject(options.error);
                  }
                  else {
                    try {
                      const response = await globals.fetch(url, options, validCodes);
                      resolve(response);
                    }
                    catch (err) {
                      reject(err);
                    }
                  }
                }, 100);
              }
              else {
                console.error(`[SERVER] Network failure for ${url}:`, err);
                options.error.name = err.name;
                options.error.message = `${err.message} for URL: ${url}`;
                reject(options.error);
              }
            }
          });
        },

        reportError(section, err) {
          // Ensure config is loaded before trying to report
          if (!globals.config || !globals.config.api) {
            console.error("Error reporting disabled: globals.config.api not set.", section, err);
            return;
          }
          const message = err.stack || err.message || err;
          const body = JSON.stringify({
            username: globals.currentUser,
            version: globals.systemData.version,
            platform: globals.systemData.platform,
            message: message.slice(0, 1000),
            section,
          });
          globals.fetch(`${globals.config.api}/v1/reportError`, {
            method: "POST",
            mode: "cors",
            headers: {
              "Content-Type": "application/json"
            },
            body,
            userAbortController: false,  // prevent user from aborting
          }, [413, 403]).catch(err => {
            // Silently handle errors in error reporting to prevent cascading error loops
            // 403 errors on error reporting endpoint are not critical
            if (err.message && err.message.includes('403')) {
              console.warn("[ERROR REPORTING] Error reporting endpoint returned 403 - this is non-critical");
            } else {
              console.log("[ERROR REPORTING] Failed to report error:", err);
            }
          });
        },

        parseBool(val) {
          return val ? val !== "false" : false;
        },

        genericError(err) {
          globals.reportError("webClient", err);
          window.alert("Something went wrong :(");
        },

        getClientData() {
          return {
            clientPlatform: "electron",
            clientPlatformVersion: globals.systemData.version,
            clientOS: globals.systemData.platform === "darwin"
            ? "mac"
            : globals.systemData.platform === "win32"
            ? "win"
            : "linux",
          };
        },

        async getRequiredApiPort() {
          const port = await window.ipc.invoke('get-api-port');
          if (!port) throw new Error('API server is not running. Please restart the application.');
          return port;
        },

        async authenticateWithAuthToken(authToken) {
          if (!authServiceInstance) {
            authServiceInstance = new AuthService({
              globals: globals,
              showOtpModal: showOtpModal,
              getGameData: () => getGameData
            });
          }
          return await authServiceInstance.authenticateWithAuthToken(authToken);
        },

        async authenticateWithRefreshToken(refreshToken, otp) {
          if (!authServiceInstance) {
            authServiceInstance = new AuthService({
              globals: globals,
              showOtpModal: showOtpModal,
              getGameData: () => getGameData
            });
          }
          return await authServiceInstance.authenticateWithRefreshToken(refreshToken, otp);
        },

        async authenticateWithPassword(username, password, otp, customDf) {
          if (!authServiceInstance) {
            authServiceInstance = new AuthService({
              globals: globals,
              showOtpModal: showOtpModal,
              getGameData: () => getGameData
            });
          }
          return await authServiceInstance.authenticateWithPassword(username, password, otp, customDf);
        },

        async getFlashVarsFromWeb() {
          const response = await globals.fetch(`${globals.config.web}/flashvars?_=${Date.now()}`, {
            method: "GET",
            mode: "cors",
            credentials: "include",
            cache: "no-store",
          });
          const responseText = await response.text();
          if (!responseText) {
            throw new Error("Empty response from flashvars endpoint");
          }
          try {
            return JSON.parse(responseText);
          } catch (parseError) {
            console.error(`[ANIMAL JAM] Failed to parse flashvars response:`, parseError);
            throw new Error("Invalid flashvars response format");
          }
        },

        localize() {
          document.getElementById("login-screen").localize();
        },

        reloadGame() {
          document.getElementById("login-screen").logIn();
        },
      };

      const pendingTranslations = new Map();
      const cachedTranslations = new Map();
      let nextTranslationRequestId = 0;

      window.ipc.on("translate", (event, data) => {
        cachedTranslations.set(data.phrase, data.value);
        const resolve = pendingTranslations.get(data.requestId);
        if (resolve) {
          pendingTranslations.delete(data.requestId);
          resolve(data.value);
        }
      });

      window.addEventListener("error", err => {
        globals.reportError("webClient", err.stack || err.error.stack);
      });
      window.addEventListener("unhandledrejection", event => {
        globals.reportError("webClient", event.reason.stack || event.reason.error.stack);
      });

      const showOtpModal = () => {
        console.log("[OTP Modal] showOtpModal called - creating OTP modal");
        const modal = document.createElement("otp-modal");
        
        modal.addEventListener("close", event => {
          console.log("[OTP Modal] OTP modal closed");
          document.getElementById("modal-layer").removeChild(modal);
          const loginScreen = document.getElementById("login-screen");
          if (loginScreen) {
            console.log("[OTP Modal] Modal closed without submission, unblocking UI");
            loginScreen.loginBlocked = false;
          }
        });
        
        modal.addEventListener("submit", event => {
          console.log("[OTP Modal] OTP submitted:", event.detail.otp);
          document.getElementById("modal-layer").removeChild(modal);
          const loginScreen = document.getElementById("login-screen");
          loginScreen.otp = event.detail.otp;
          console.log("[OTP Modal] Unblocking UI before calling logIn again");
          loginScreen.loginBlocked = false;
          console.log("[OTP Modal] UI unblocked, calling loginScreen.logIn()");
          loginScreen.logIn();
        });
        
        const modalLayer = document.getElementById("modal-layer");
        if (modalLayer) {
          modalLayer.appendChild(modal);
          console.log("[OTP Modal] OTP modal successfully added to modal-layer");
        } else {
          console.error("[OTP Modal] modal-layer element not found!");
        }
      };

      class AuthService {
        constructor(options = {}) {
          this.globals = options.globals || globals;
          this.showOtpModal = options.showOtpModal || showOtpModal;
          this.getDf = options.getDf || null;
          this.getGameData = options.getGameData || null;
          this.fetch = options.fetch || (this.globals && this.globals.fetch);
          this.config = options.config || (this.globals && this.globals.config);
        }

        isTokenExpired(token) {
          if (!token) return true
          const tokenParts = token.split('.')
          if (tokenParts.length !== 3) return false
          try {
            const payloadBase64 = tokenParts[1].replace(/-/g, '+').replace(/_/g, '/')
            const decodedJson = atob(payloadBase64)
            const decoded = JSON.parse(decodedJson)
            if (typeof decoded.exp !== 'number') return true
            const nowInSeconds = Date.now() / 1000
            return decoded.exp < (nowInSeconds + 30)
          } catch (e) {
            return true
          }
        }

        async authenticate(request, customDf, showOtpModalCallback) {
          const showOtp = showOtpModalCallback || this.showOtpModal;
          const getGameDataFunc = typeof this.getGameData === 'function' ? this.getGameData() : (this.getGameData || null);
          const fetch = this.fetch || (this.globals && this.globals.fetch);
          const config = this.config || (this.globals && this.globals.config);

          if (!fetch || !config) {
            throw new Error("AuthService: fetch or config not available");
          }

          request.domain = "flash";

          try {
            const freshDf = await window.ipc.getDf();

            if (freshDf && this.globals) {
              this.globals.df = freshDf;
            } else if (!freshDf) {
              console.warn("[AUTH] Failed to get fresh DF from main process");
            }
          } catch (err) {
            console.warn(`[AUTH] Error getting fresh df: ${err.message}`);
          }

          if (!this.globals || !this.globals.df) {
            console.error("[AUTH] No valid DF available, authentication may fail");
          }

          const dfToUse = customDf || (this.globals ? this.globals.df : null);
          request.df = dfToUse;

          // Build headers with Origin, Referer, User-Agent, and Accept to match server expectations
          const authHeaders = {
            "Content-Type": "application/json",
            "Accept": "application/json",
          };
          
          // Add Origin and Referer headers if config.origin is available
          if (config.origin) {
            authHeaders["Origin"] = config.origin;
            authHeaders["Referer"] = `${config.origin}/game/play`;
          }
          
          // Add User-Agent to match expected format
          authHeaders["User-Agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) AJClassic/1.5.7 Chrome/87.0.4280.141 Electron/11.5.0 Safari/537.36";

          const response = await fetch(`${config.authenticator}/authenticate`, {
            method: "POST",
            mode: "cors",
            cache: "no-store",
            headers: authHeaders,
            body: JSON.stringify(request),
          }, [401, 403, 422, 500]);

          if (response.status === 200) {
            const authenticateData = JSON.parse(await response.text());
            const authenticatedByToken = (request.refresh_token !== undefined);
            if (getGameDataFunc) {
              return await getGameDataFunc(authenticateData, authenticatedByToken, dfToUse);
            } else {
              return authenticateData;
            }
          }

          if (response.status === 401) {
            const authError = JSON.parse(await response.text());

            const errorText = (authError.error || authError.message || '').toLowerCase();
            const errorCode = authError.error_code;

            if (errorText.includes('otp') ||
                errorText.includes('two') ||
                errorText.includes('2fa') ||
                errorText.includes('verification') ||
                errorCode === 'otp_required' ||
                errorCode === 'two_factor_required') {
              if (showOtp) showOtp();
              throw new Error("OTP_NEEDED");
            }

            switch (authError.error_code) {
              case 100: throw new Error("REFRESH_TOKEN_EXPIRED");
              case 101: throw new Error("WRONG_CREDENTIALS");
              case 102: throw new Error("BANNED");
              case 103: throw new Error("SUSPENDED");
              default: throw new Error("LOGIN_ERROR");
            }
          }

          if (response.status === 422) {
            let otpNeeded = false;
            try {
              const responseText = await response.text();
              const authError = JSON.parse(responseText);
              if (authError.error == "invalid_otp" || authError.error == "pending_otp_confirmation") {
                otpNeeded = true;
              }
            } catch (parseErr) {
              console.error("[AUTH] Error parsing 422 response:", parseErr);
            }

            if (otpNeeded) {
              if (showOtp) showOtp();
              throw new Error("OTP_NEEDED");
            }
            throw new Error("LOGIN_ERROR");
          }

          if (response.status === 403) {
            try {
              const responseText = await response.text();
              
              if (responseText) {
                try {
                  const errorData = JSON.parse(responseText);
                  const errorText = (errorData.error || errorData.message || '').toLowerCase();
                  
                  if (errorText.includes('rate') || errorText.includes('limit') || errorText.includes('too many')) {
                    throw new Error("RATE_LIMITED");
                  }
                } catch (parseErr) {
                }
              }
              
              const rateLimitRemaining = response.headers.get('X-RateLimit-Remaining');
              
              if (rateLimitRemaining === '0' || rateLimitRemaining === null) {
                throw new Error("RATE_LIMITED");
              }
              
              console.error("[AUTH] 403 Forbidden - possible IP block or missing permissions");
              throw new Error("LOGIN_ERROR");
            } catch (err) {
              if (err.message === "RATE_LIMITED" || err.message === "LOGIN_ERROR") {
                throw err;
              }
              console.error("[AUTH] Could not parse 403 response:", err);
              throw new Error("LOGIN_ERROR");
            }
          }

          console.error("[AUTH] Unexpected response status:", response.status);

          try {
            const responseText = await response.text();
            const errorData = JSON.parse(responseText);
            const errorText = (errorData.error || errorData.message || '').toLowerCase();

            if (errorText.includes('otp') ||
                errorText.includes('two') ||
                errorText.includes('2fa') ||
                errorText.includes('verification')) {
              if (showOtp) showOtp();
              throw new Error("OTP_NEEDED");
            }
          } catch (parseErr) {
            console.error("[AUTH] Could not parse response body:", parseErr);
          }

          throw new Error("ERROR");
        }

        async authenticateWithAuthToken(authToken, showOtpModalCallback) {
          const request = {auth_token: authToken};
          try {
            const result = await this.authenticate(request, null, showOtpModalCallback);
            return result;
          } catch (err) {
            console.error("[AUTH] Token validation failed:", err.message);
            throw err;
          }
        }

        async authenticateWithRefreshToken(refreshToken, otp, showOtpModalCallback) {
          const request = {refresh_token: refreshToken};
          if (otp) {
            request.otp = otp;
          }
          return await this.authenticate(request, null, showOtpModalCallback);
        }

        async authenticateWithPassword(username, password, otp, customDf, showOtpModalCallback) {
          const request = {username, password};
          if (otp) {
            request.otp = otp;
          }
          return await this.authenticate(request, customDf, showOtpModalCallback);
        }
      }

      let authServiceInstance = null;

      const showRenameUserModal = (username, renameToken) => {
        const modal = document.createElement("ajd-rename-user-modal");
        modal.userData = {
          username,
          renameToken,
        };
        modal.addEventListener("accountCreated", event => {
          document.getElementById("login-screen").username = event.detail.username;
          document.getElementById("modal-layer").removeChild(modal);
        });
        modal.addEventListener("close", event => {
          document.getElementById("modal-layer").removeChild(modal);
        });
        document.getElementById("modal-layer").appendChild(modal);
      };

      let getGameData = null;

      const authenticate = async (request, customDf) => {
        if (!authServiceInstance) {
          authServiceInstance = new AuthService({
            globals: globals,
            showOtpModal: showOtpModal,
            getGameData: () => getGameData
          });
        }
        return await authServiceInstance.authenticate(request, customDf);
      };

      getGameData = async (authenticateData, authenticatedByToken, customDf) => {
        let flashVars = await globals.getFlashVarsFromWeb();
        const requestedClientVersion = (globals.rcToken && flashVars.smoke_version)
          ? flashVars.smoke_version : flashVars.deploy_version;

        const playerSessionData = await getPlayerSessionData(
          authenticateData.auth_token,
          requestedClientVersion
        );

        if (flashVars.deploy_version != requestedClientVersion) {
          flashVars.deploy_version = requestedClientVersion;
        }

        if (playerSessionData.game_server && playerSessionData.game_server != "NONE_AVAIL") {
          flashVars.smartfoxServer = playerSessionData.game_server;
          flashVars.blueboxServer = playerSessionData.game_server;
        }

        const userData = {
          username: playerSessionData.screen_name,
          accountType: playerSessionData.game_account_type,
          language: playerSessionData.language,
          authToken: authenticateData.auth_token,
        };
        if (authenticateData.refresh_token) {
          userData.refreshToken = authenticateData.refresh_token;
        }

        globals.authToken = userData.authToken;
        globals.currentUser = userData.username;
        globals.setLanguage(userData.language);

        const apiPort = await globals.getRequiredApiPort();
        flashVars.content = `http://localhost:${apiPort}/`
        flashVars.clientURL = `http://localhost:${apiPort}/${flashVars.deploy_version}/ajclient.swf?t=${Date.now()}`
        flashVars.playerWallHost = `http://localhost:${apiPort}/wall/`;
        flashVars.mdUrl = `http://localhost:${apiPort}/game/`;
        
        console.log(`[SWF] Client URL: ${flashVars.clientURL}`);

        // Don't wait for this call, it is purely informational
        // reportLogin({
        //   username: userData.username,
        //   version: globals.systemData.version,
        //   platform: globals.systemData.platform,
        //   userId: playerSessionData.id,
        //   usedToken: authenticatedByToken,
        // });

        // Pass customDf to appendFlashVars and await the result
        flashVars = await appendFlashVars(flashVars, customDf || globals.df);

        return {userData, flashVars};
      };

      // Modify appendFlashVars to prioritize the passed df, falling back to globals.df
      const appendFlashVars = async (flashVars, dfToUse) => {
        // If no DF was provided and globals.df is null, get a fresh DF
        if (!dfToUse && !globals.df) {
          try {
            console.log("[DF] No valid DF found, requesting fresh DF from main process");
            const freshDf = await window.ipc.getDf();
            if (freshDf) {
              globals.df = freshDf;
              console.log(`[DF] Successfully retrieved fresh DF: ${freshDf.substr(0, 8)}...`);
            } else {
              console.warn("[DF] Failed to get fresh DF from main process");
            }
          } catch (err) {
            console.error(`[DF] Error getting fresh DF: ${err.message}`);
          }
        }
        
        // Use the provided dfToUse if valid, otherwise fallback to the globally stored df
        const finalDf = dfToUse || globals.df; 
        
        // Log the df value being used for debugging (handle null values safely)
        
        // Allow for testing different locale values for server swapping
        // Fetch settings and await their resolution
        let localeOverride = '';
        
        try {
          // Check for locale override (this is now the server swap value)
          localeOverride = await window.ipc.invoke('get-setting', 'debug.locale') || '';
          
          if (localeOverride) {
            console.log(`[Server Debug] Using server swap locale: ${localeOverride}`);
          }
        } catch (err) {
          console.log(`[Server Debug] Error fetching locale override:`, err);
          localeOverride = '';
        }
        
        const serverPort = await window.ipc.invoke('get-server-port').catch(() => null);
        if (!serverPort) {
          globals.genericError('Connection server is not running. Please restart the application.');
          return;
        }

        Object.assign(
          flashVars,
          globals.getClientData(),
          globals.reloadFlashVars,
          {
            auth_token: globals.authToken,
            df: finalDf,
            locale: localeOverride || globals.language,
            smartfoxServer: "127.0.0.1",
            blueboxServer: "127.0.0.1",
            smartfoxPort: serverPort.toString(),
            blueboxPort: serverPort.toString(),
            username: globals.currentUser,
            webRefPath: "game/play",
          },
        );
        // Explicitly set the df value AFTER merging to ensure it's the correct one
        flashVars.df = finalDf;
        
        if (!flashVars.playerWallHost || flashVars.playerWallHost.includes('prod-wall.animaljam.com')) {
          const apiPort = await globals.getRequiredApiPort();
          flashVars.playerWallHost = `http://localhost:${apiPort}/wall/`;
        }

        if (!flashVars.mdUrl || flashVars.mdUrl.includes('jammercentral.animaljam.com')) {
          const apiPort = await globals.getRequiredApiPort();
          flashVars.mdUrl = `http://localhost:${apiPort}/game/`;
        }
        
        globals.reloadFlashVars = null;
        
        return flashVars;
      };

      const getPlayerSessionData = async (authToken, clientVersion) => {
        let params = `domain=flash&client_version=${encodeURIComponent(clientVersion)}`;
        if (globals.rcToken) {
          params += "&rc_token=" + encodeURIComponent(globals.rcToken);
        }
        
        const response = await globals.fetch(`${globals.config.playerSessionData}/player?${params}&_=${Date.now()}`, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          headers: {
            "Authorization": `Bearer ${authToken}`,
          },
        }, [401]);
        if (response.status === 401) {
          console.error(`[ANIMAL JAM] Player session request returned 401: auth token expired`);
          throw new Error("AUTH_TOKEN_EXPIRED");
        }
        if (response.status !== 200) {
          console.error(`[ANIMAL JAM] Player session request failed with status: ${response.status}`);
          throw new Error("AJ_SERVER_ERROR");
        }
        
        let responseData;
        try {
          const responseText = await response.text();
          if (!responseText) {
            throw new Error("Empty response from player session data endpoint");
          }
          responseData = JSON.parse(responseText);
        } catch (parseError) {
          console.error(`[ANIMAL JAM] Failed to parse player session data response:`, parseError);
          throw new Error("AUTH_TOKEN_EXPIRED");
        }
        
        if (!responseData || typeof responseData !== 'object') {
          console.error(`[ANIMAL JAM] Invalid player session data format:`, responseData);
          throw new Error("AUTH_TOKEN_EXPIRED");
        }
        
        if (responseData.rename_required) {
          showRenameUserModal(responseData.screen_name, responseData.rename_required_key);
          throw new Error("USER_RENAME_NEEDED");
        }
        return responseData;
      };

      // const reportLogin = (data) => {
      //   globals.fetch(`${globals.config.api}/v1/login`, {
      //     method: "POST",
      //     mode: "cors",
      //     headers: {
      //       "Content-Type": "application/json"
      //     },
      //     body: JSON.stringify(data),

      //   }).catch(err => {
      //     globals.reportError("webClient", `Failed to contact Electron API: ${err}`);
      //   });
      // };
    </script>

    <div id="modal-layer"></div>
    <ajd-login-screen id="login-screen"></ajd-login-screen>
    <ajd-game-screen id="game-screen"></ajd-game-screen>

    <script>
      "use strict";

      (() => {
        const loginScreen = document.getElementById("login-screen");
        const gameScreen = document.getElementById("game-screen");

        loginScreen.addEventListener("loggedIn", event => {
          if (loginScreen._loginTimeout) {
            clearTimeout(loginScreen._loginTimeout);
            loginScreen._loginTimeout = null;
            loginScreen._loginTimeoutCleared = true;
          }
          gameScreen.loadGame(event.detail.flashVars, event.detail.theme);
        });
        gameScreen.addEventListener("gameLoaded", event => {
          if (loginScreen._loginTimeout) {
            clearTimeout(loginScreen._loginTimeout);
            loginScreen._loginTimeout = null;
            loginScreen._loginTimeoutCleared = true;
          }
          loginScreen.loginBlocked = false;
          gameScreen.classList.add("show");
          setTimeout(() => {
            document.getElementById("login-screen").localize();
          }, 1000);
        });
        gameScreen.addEventListener("loadFailed", event => {
          loginScreen.loginBlocked = false;
        });
        gameScreen.addEventListener("switchToLogin", event => {
          gameScreen.classList.remove("show");
        });
        gameScreen.addEventListener("accountCreated", event => {
          loginScreen.username = event.detail.username;
          loginScreen.password = event.detail.password;
          loginScreen.rememberMe = true;
        });

        // Show login screen immediately when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('dom-ready');
        });

        window.ipc.on('port-error', (event, data) => {
          const modal = document.createElement('ajd-message-modal');
          modal.header = 'Connection Error';
          modal.body = data.message;
          modal.addEventListener('close', () => modal.remove());
          document.body.appendChild(modal);
        });

        // Keep window.onload for full resource loading completion
        window.onload = () => {
          document.querySelector("body").classList.add("show");

          // prevent user from dragging image onto app and redirecting
          document.addEventListener("dragover", event => {
            event.preventDefault();
            return false;
          }, false);
          document.addEventListener("drop", event => {
            event.preventDefault();
            return false;
          }, false);
          
          // Ensure loginScreen has logIn method
          if (!loginScreen.logIn) {
            console.warn("Adding missing logIn method to login-screen");
            loginScreen.logIn = async function() {
              console.log("Default logIn method called on login-screen");
              
              // Simulate successful login with minimal data
              const flashVars = await globals.getFlashVarsFromWeb();
              this.dispatchEvent(new CustomEvent("loggedIn", {
                detail: {
                  flashVars: flashVars
                }
              }));
              
              return Promise.resolve();
            };
          }
        };

        window.ipc.on("loginInfoLoaded", (event, data) => {
          loginScreen.username = data.username;
          loginScreen.password = data.password || "";
          loginScreen.rememberMe = data.rememberMe;
          globals.config = data.config;
          globals.currentUser = data.username;
          globals.df = data.df;
          globals.rcToken = data.rcToken;
        });

        window.ipc.on("direct-game-load", (event, data) => {
          if (data.config) globals.config = data.config;
          if (data.flashVars) {
            globals.authToken = data.flashVars.auth_token;
            globals.df = data.flashVars.df;
            globals.currentUser = data.flashVars.username;
            globals.setLanguage(data.flashVars.locale || 'en');
            loginScreen.style.display = 'none';
            gameScreen.loadGame(data.flashVars);
            gameScreen.classList.add("show");
            window.ipc.send("loginSucceeded", {
              username: data.flashVars.username,
              authToken: data.flashVars.auth_token,
              language: data.flashVars.locale || 'en',
              rememberMe: false
            });
          }
        });

        window.addEventListener("keydown", event => {
          window.ipc.send("keyEvent", {
            metaKey: event.metaKey,
            altKey: event.altKey,
            ctrlKey: event.ctrlKey,
            shiftKey: event.shiftKey,
            keyCode: event.keyCode,
            key: event.key,
          });
        }, true);

        window.ipc.send("loaded");

        window.ipc.on("obtainedToken", (event, data) => {
          try {
            loginScreen.authToken = data.token;
            loginScreen.logIn();
          }
          catch (err) {
            globals.reportError("webClient", err);
          }
        });

        window.ipc.send("ready");
        // Send winReady signal to main process
        window.ipc.send("winReady");

        // Initialize tester state after system data is loaded
        window.ipc.on("postSystemData", (event, data) => {
            globals.systemData.version = data.version || globals.systemData.version;
            globals.systemData.platform = data.platform || globals.systemData.platform;
            globals.systemData.platformRelease = data.platformRelease || globals.systemData.platformRelease;
            loginScreen.version = globals.systemData.version;
            globals.affiliateCode = data.affiliateCode;
            globals.setLanguage(data.language);
            globals.localize();
            
            // Removed tester state initialization call for public build
            // console.log('[DIAGNOSTIC] Tester initialization removed from public build.');
            
        });

        window.ipc.on("log", (event, data) => {
          if (data.level.toLowerCase() === "error") {
            globals.reportError("electronClient", data.message);
          }
          
          // Filter out noisy logs to keep console clean
          const message = data.message || '';
          const shouldSkip = message.includes('Retrieved plaintext password') ||
                           message.includes('[WINAPP AccMan Helper]') ||
                           message.includes('[App] App ready') ||
                           message.includes('[AutoUpdate]') ||
                           message.includes('[DevTools] Toggled');
          
          if (!shouldSkip) {
            switch (data.level) {
              case "debug": console.debug(data.message); break;
              case "warn": console.warn(data.message); break;
              case "error": console.error(data.message); break;
              default: console.log(data.message); break;
            }
          }
        });
      })();

      // Listen for electron IPC messages
      window.ipc.on('winReady', (event, ...args) => {
        window.globals.isElectron = true;
        document.dispatchEvent(new CustomEvent('winReady', { detail: args }));
      });

      // Add handler for UUID update events
      window.ipc.on('update-df', (event, newDf) => {
        if (window.globals) {
          window.globals.df = newDf;
        } else {
          console.error('Globals not available for df update');
        }
      });

      window.ipc.on("screenChange", (event, state) => {
        const gameScreenElement = document.getElementById("game-screen");
        if (gameScreenElement && typeof gameScreenElement.setScreenState === 'function') {
          gameScreenElement.setScreenState(state);
        }
        // Removed noisy warnings about setScreenState method
      });

      // Handle exit confirmation modal
      window.ipc.on("show-exit-confirmation", () => {
        console.log("[Exit Confirmation] Received show-exit-confirmation message");
        showExitConfirmationModal();
      });

      function showExitConfirmationModal() {
        // Remove any existing modal
        const existingModal = document.getElementById('exit-confirmation-modal');
        if (existingModal) {
          existingModal.remove();
        }

        // Check if dark mode is enabled by looking at the login screen
        const loginScreen = document.getElementById('login-screen');
        const isDarkMode = loginScreen && loginScreen.classList.contains('dark-mode');

        // Create modal backdrop
        const modalBackdrop = document.createElement('div');
        modalBackdrop.id = 'exit-confirmation-modal';
        modalBackdrop.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.7);
          backdrop-filter: blur(5px);
          z-index: 10000;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'CCDigitalDelivery', sans-serif;
        `;

        // Create modal content with conditional styling
        const modalContent = document.createElement('div');
        const backgroundColor = isDarkMode ? 'rgba(45, 45, 45, 0.95)' : 'rgba(255, 245, 230, 0.95)';
        const borderColor = isDarkMode ? 'rgba(255, 255, 255, 0.3)' : '#e83d52';
        const boxShadow = isDarkMode ? '0 20px 40px rgba(0, 0, 0, 0.4)' : '0 20px 40px rgba(252, 93, 93, 0.1)';
        
        modalContent.style.cssText = `
          background: ${backgroundColor};
          border: 3px solid ${borderColor};
          border-radius: 15px;
          padding: 30px;
          max-width: 450px;
          width: 90%;
          box-shadow: ${boxShadow};
          text-align: center;
          position: relative;
          animation: modalSlideIn 0.3s ease-out;
        `;

        // Define colors based on dark mode
        const titleColor = isDarkMode ? '#E0E0E0' : '#e83d52';
        const textColor = isDarkMode ? '#E0E0E0' : '#333333';
        const labelColor = isDarkMode ? '#B0B0B0' : '#666666';

        modalContent.innerHTML = `
          <style>
            @keyframes modalSlideIn {
              from { opacity: 0; transform: scale(0.9) translateY(-20px); }
              to { opacity: 1; transform: scale(1) translateY(0); }
            }
          </style>
          <div style="color: ${titleColor}; font-size: 24px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <span style="background: #E74C3C; color: white; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 18px;">✕</span>
            Exit Game
          </div>
          <div style="color: ${textColor}; font-size: 16px; line-height: 1.5; margin-bottom: 25px;">
            Are you sure you want to exit the game?<br>
            This will close all plugins as well.
          </div>
          <div style="margin-bottom: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; user-select: none;" id="dontAskContainer">
            <input type="checkbox" id="dontAskCheckbox" style="width: 16px; height: 16px; cursor: pointer; accent-color: #e83d52;">
            <label for="dontAskCheckbox" style="color: ${labelColor}; font-size: 14px; cursor: pointer;">Don't ask me again</label>
          </div>
          <div style="display: flex; gap: 15px; justify-content: center;">
            <button id="cancelBtn" style="background: #4A5568; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; min-width: 100px;">Cancel</button>
            <button id="confirmBtn" style="background: #e83d52; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; min-width: 100px;">Yes, Exit</button>
          </div>
        `;

        modalBackdrop.appendChild(modalContent);
        document.body.appendChild(modalBackdrop);

        // Add event listeners
        const cancelBtn = modalContent.querySelector('#cancelBtn');
        const confirmBtn = modalContent.querySelector('#confirmBtn');
        const dontAskContainer = modalContent.querySelector('#dontAskContainer');
        const checkbox = modalContent.querySelector('#dontAskCheckbox');

        function closeModal(confirmed) {
          const dontAskAgain = checkbox.checked;
          
          console.log(`[Exit Confirmation] User response: confirmed=${confirmed}, dontAskAgain=${dontAskAgain}`);
          
          // Send response back to main process
          window.ipc.send('exit-confirmation-response', {
            confirmed: confirmed,
            dontAskAgain: dontAskAgain
          });

          // Remove modal
          modalBackdrop.remove();
        }

        // Button event listeners
        cancelBtn.addEventListener('click', () => closeModal(false));
        confirmBtn.addEventListener('click', () => closeModal(true));

        // Checkbox container click
        dontAskContainer.addEventListener('click', (e) => {
          if (e.target !== checkbox) {
            checkbox.checked = !checkbox.checked;
          }
        });

        // Backdrop click to cancel
        modalBackdrop.addEventListener('click', (e) => {
          if (e.target === modalBackdrop) {
            closeModal(false);
          }
        });

        // Escape key to cancel
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            document.removeEventListener('keydown', handleKeyDown);
            closeModal(false);
          }
        };
        document.addEventListener('keydown', handleKeyDown);

        // Button hover effects
        cancelBtn.addEventListener('mouseenter', () => {
          cancelBtn.style.background = '#5A6578';
          cancelBtn.style.transform = 'translateY(-1px)';
        });
        cancelBtn.addEventListener('mouseleave', () => {
          cancelBtn.style.background = '#4A5568';
          cancelBtn.style.transform = 'translateY(0)';
        });

        confirmBtn.addEventListener('mouseenter', () => {
          confirmBtn.style.background = '#c73650';
          confirmBtn.style.transform = 'translateY(-1px)';
        });
        confirmBtn.addEventListener('mouseleave', () => {
          confirmBtn.style.background = '#e83d52';
          confirmBtn.style.transform = 'translateY(0)';
        });

        // Focus the cancel button
        setTimeout(() => cancelBtn.focus(), 100);
      }

    </script>
