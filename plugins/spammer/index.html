<head>
  <meta charset="UTF-8">
  <title>Packet Spammer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="app://assets/styles/style.css" rel="stylesheet">
  <style>
    .sp-section { border-bottom: 1px solid rgba(156,163,175,0.1); }
    .sp-label { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
    .sp-input { background: #1e1f2e; border: 1px solid rgba(156,163,175,0.15); border-radius: 4px; padding: 6px 10px; color: #fff; font-size: 12px; }
    .sp-input:focus { outline: none; border-color: var(--theme-primary, #e83d52); }
    .sp-input::placeholder { color: rgba(255,255,255,0.4); }
    .sp-select { background: #1e1f2e; border: 1px solid rgba(156,163,175,0.15); border-radius: 4px; padding: 5px 8px; color: #fff; font-size: 12px; color-scheme: dark; }
    .sp-textarea { width: 100%; background: #1e1f2e; border: 1px solid rgba(156,163,175,0.15); border-radius: 4px; padding: 8px 10px; color: #fff; font-size: 12px; resize: vertical; min-height: 60px; font-family: monospace; }
    .sp-textarea:focus { outline: none; border-color: var(--theme-primary, #e83d52); }
    .sp-textarea::placeholder { color: rgba(255,255,255,0.4); }
    .sp-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s ease; }
    .sp-btn-start { background: rgba(16,185,129,0.2); color: #10b981; }
    .sp-btn-start:hover { background: rgba(16,185,129,0.3); }
    .sp-btn-stop { background: rgba(239,68,68,0.2); color: #ef4444; }
    .sp-btn-stop:hover { background: rgba(239,68,68,0.3); }
    .sp-btn-secondary { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); border: 1px solid rgba(156,163,175,0.15); }
    .sp-btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .sp-btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; }
    .sp-btn-danger:hover { background: rgba(239,68,68,0.25); }
    .tab-btn { padding: 6px 14px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.2s ease; }
    .tab-btn:hover { color: rgba(255,255,255,0.8); }
    .tab-btn.active-tab { color: var(--theme-primary, #e83d52); border-bottom-color: var(--theme-primary, #e83d52); }
    .tab-content { display: flex; }
    .tab-content.hidden { display: none; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(255,255,255,0.04); }
    th { text-align: left; padding: 6px 10px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid rgba(156,163,175,0.15); }
    td { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid rgba(156,163,175,0.08); color: rgba(255,255,255,0.8); }
    tr:hover { background: rgba(255,255,255,0.03); }
    .filter-btn { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); border: none; cursor: pointer; transition: all 0.15s ease; }
    .filter-btn:hover { background: rgba(255,255,255,0.1); }
    .filter-btn.active { background: var(--theme-primary, #e83d52); color: #fff; }
    #packetNetworkLog { table-layout: fixed; width: 100%; }
    #packetNetworkLog td:nth-child(1) { width: 120px; }
    #packetNetworkLog td:nth-child(2) { width: 80px; }
    #packetNetworkLog td:nth-child(3) { width: auto; min-width: 0; }
  </style>
</head>
<body class="bg-primary-bg text-text-primary p-0 h-screen flex flex-col overflow-hidden">

  <div class="jam-plugin-header">
    <span class="jam-plugin-title">Packet Spammer</span>
    <div class="jam-plugin-controls">
      <button class="jam-plugin-minimize" aria-label="Minimize"><i class="fas fa-minus"></i></button>
      <button class="jam-plugin-close" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <div class="jam-plugin-content" style="padding: 0; flex: 1; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; border-bottom: 1px solid rgba(156,163,175,0.15); padding: 0 8px; flex-shrink: 0;">
      <button class="tab-btn active-tab" onclick="spammer.switchTab('queue')">Queue</button>
      <button class="tab-btn" onclick="spammer.switchTab('network')">Network</button>
      <button class="tab-btn" onclick="spammer.switchTab('history')">History</button>
      <button class="tab-btn" onclick="spammer.switchTab('templates')">Templates</button>
    </div>

    <div id="queue-tab" class="tab-content" style="flex: 1; flex-direction: column; overflow: hidden;">
      <div style="flex: 1; overflow-y: auto;">
        <table>
          <thead><tr><th>Type</th><th>Content</th><th>Delay</th><th style="width: 100px;">Actions</th></tr></thead>
          <tbody id="table"></tbody>
        </table>
      </div>

      <div class="sp-section" style="padding: 8px 10px;">
        <textarea id="inputTxt" class="sp-textarea" placeholder="Enter packet content..."></textarea>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 6px;">
          <select id="inputType" class="sp-select" style="width: auto;">
            <option value="connection">Client</option>
            <option value="aj">Server</option>
          </select>
          <input type="number" id="inputDelay" step="0.1" min="0" class="sp-input" style="width: 80px;" placeholder="Delay (s)">
          <button type="button" onclick="spammer.addClick()" class="sp-btn sp-btn-secondary" style="flex: 1;"><i class="fas fa-plus mr-1"></i> Add</button>
          <button type="button" onclick="spammer.sendFromInput()" class="sp-btn sp-btn-secondary" style="flex: 1;"><i class="fas fa-paper-plane mr-1"></i> Send</button>
        </div>
      </div>

      <div class="sp-section" style="padding: 8px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
        <select id="targetAccount" class="sp-select" style="width: auto; min-width: 120px;">
          <option value="">All Accounts</option>
        </select>
        <select id="inputRunType" class="sp-select" style="width: auto;">
          <option value="once">Once</option>
          <option value="loop">Loop</option>
        </select>
        <button type="button" onclick="spammer.saveTemplate()" class="sp-btn sp-btn-secondary"><i class="fas fa-star mr-1"></i> Save Template</button>
        <div style="margin-left: auto; display: flex; gap: 6px;">
          <button type="button" id="runButton" onclick="spammer.runClick()" class="sp-btn sp-btn-start"><i class="fas fa-play mr-1"></i> Start</button>
          <button type="button" id="stopButton" onclick="spammer.stopClick()" class="sp-btn sp-btn-stop"><i class="fas fa-stop mr-1"></i> Stop</button>
        </div>
      </div>
    </div>

    <div id="history-tab" class="tab-content hidden" style="flex: 1; flex-direction: column; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; flex-shrink: 0; border-bottom: 1px solid rgba(156,163,175,0.1);">
        <span class="sp-label">Sent Packet History</span>
        <button type="button" onclick="spammer.clearHistory()" class="sp-btn sp-btn-danger" style="font-size: 11px; padding: 3px 10px;"><i class="fas fa-trash-alt mr-1"></i> Clear</button>
      </div>
      <div style="flex: 1; overflow-y: auto;">
        <table><thead><tr><th>Type</th><th>Content</th><th style="width: 80px;">Actions</th></tr></thead>
        <tbody id="historyTable"></tbody></table>
      </div>
    </div>

    <div id="templates-tab" class="tab-content hidden" style="flex: 1; flex-direction: column; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; flex-shrink: 0; border-bottom: 1px solid rgba(156,163,175,0.1);">
        <span class="sp-label">Templates</span>
        <div style="display: flex; gap: 4px;">
          <button type="button" onclick="spammer.importTemplates()" class="sp-btn sp-btn-secondary" style="font-size: 11px; padding: 3px 8px;"><i class="fas fa-upload mr-1"></i> Import</button>
          <button type="button" onclick="spammer.exportTemplates()" class="sp-btn sp-btn-secondary" style="font-size: 11px; padding: 3px 8px;"><i class="fas fa-download mr-1"></i> Export</button>
          <button type="button" onclick="spammer.loadTemplates()" class="sp-btn sp-btn-secondary" style="font-size: 11px; padding: 3px 8px;"><i class="fas fa-sync-alt mr-1"></i> Reload</button>
        </div>
      </div>
      <div style="flex: 1; overflow-y: auto;">
        <table><thead><tr><th>Name</th><th style="width: 100px;">Actions</th></tr></thead>
        <tbody id="templatesTable"></tbody></table>
      </div>
    </div>

    <div id="network-tab" class="tab-content hidden" style="flex: 1; flex-direction: column; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; flex-shrink: 0; border-bottom: 1px solid rgba(156,163,175,0.1); flex-wrap: wrap; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="display: flex; gap: 3px;">
            <button id="filterAllButton" class="filter-btn active">All</button>
            <button id="filterIncomingButton" class="filter-btn">In</button>
            <button id="filterOutgoingButton" class="filter-btn">Out</button>
          </div>
          <div style="display: flex; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.5);">
            <span><span id="networkIncomingCount" style="color: #10b981;">0</span> in</span>
            <span><span id="networkOutgoingCount" style="color: #eab308;">0</span> out</span>
            <span><span id="networkTotalCount">0</span> total</span>
          </div>
        </div>
        <div style="display: flex; gap: 4px;">
          <button id="copyNetworkLogsButton" class="sp-btn sp-btn-secondary" style="font-size: 11px; padding: 3px 8px;"><i class="fas fa-copy mr-1"></i> Copy</button>
          <button id="clearNetworkLogsButton" class="sp-btn sp-btn-danger" style="font-size: 11px; padding: 3px 8px;"><i class="fas fa-trash-alt mr-1"></i> Clear</button>
        </div>
      </div>
      <div style="flex: 1; overflow-y: auto;">
        <table><thead><tr><th style="width: 120px;">Actions</th><th style="width: 80px;">Type</th><th>Content</th></tr></thead>
        <tbody id="packetNetworkLog"></tbody></table>
      </div>
    </div>
  </div>

  <div id="saveTemplateModal" class="hidden fixed inset-0 flex items-center justify-center z-50" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);">
    <div style="background: #1e1f2e; border: 1px solid rgba(156,163,175,0.2); border-radius: 8px; padding: 16px; width: 100%; max-width: 320px;">
      <div class="sp-label" style="margin-bottom: 8px;">Save Template</div>
      <input type="text" id="templateNameInput" class="sp-input" style="width: 100%; margin-bottom: 12px;" placeholder="Template name...">
      <div style="display: flex; justify-content: flex-end; gap: 6px;">
        <button id="cancelSaveTemplate" class="sp-btn sp-btn-secondary">Cancel</button>
        <button id="confirmSaveTemplate" class="sp-btn sp-btn-start">Save</button>
      </div>
    </div>
  </div>

  <script src="app://assets/scripts/Sortable.min.js"></script>
  <script src="./index.js"></script>
  <script src="app://assets/scripts/plugin-utils.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function() { initializePluginUI(); });</script>
</body>
